    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#81907c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1079" height="487" rx="24" fill="#f6f5f1" stroke="#e5e7dd"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
