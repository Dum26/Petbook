<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="488" viewBox="0 0 1080 488" role="img" aria-labelledby="title desc">
  <title id="title">Nguyên lý hoạt động của PetBook</title>
  <desc id="desc">Trình duyệt gửi yêu cầu đến Next.js. Máy chủ xác minh phiên đăng nhập bằng Supabase Auth, kiểm tra quyền đọc ghi và kết nối PostgreSQL cùng kho ảnh video riêng tư.</desc>
